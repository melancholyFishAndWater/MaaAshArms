name: install

env:
  # 版本控制：
  # - 设置 VERSION 为空字符串时，下载 latest 版本
  # - 设置 VERSION 为具体版本号时（如 v1.2.3），下载指定版本
  MAAFW_VERSION: "v5.12.2"
  MFAA_VERSION: "v2.16.1"

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "requirements.txt"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ${{ matrix.runner }}
    # Windows runner 的控制台编码是 cp1252，Python 默认拿它当 stdout 编码，print 中文会
    # UnicodeEncodeError（本机 cp936 走不到这条路径）。UTF-8 模式让所有步骤的日志按 UTF-8
    # 输出，中文正常显示；脚本侧另有 reconfigure(errors="replace") 兜底。
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        # 一档 = 一个"原生 runner + 目标平台/架构"。必须原生：
        #   * aarch64 的解释器和它的 wheel 不能在 x86_64 宿主上安装/校验；
        #   * macOS 的 wheel 必须在 macOS 宿主上解析，否则会静默装成别的平台。
        # runtime_platform 为空表示这一档不打包 Python 运行时（android 没有 CPython）。
        # mfa_os / mfa_arch 是 MFAAvalonia 资产名里的平台段（注意 macOS 用 osx）。
        include:
          - { runner: windows-latest,   artifact_os: win,     arch: x86_64,  mfa_os: win,   mfa_arch: x64,   runtime_platform: win-x64 }
          - { runner: windows-11-arm,   artifact_os: win,     arch: aarch64, mfa_os: win,   mfa_arch: arm64, runtime_platform: win-arm64 }
          - { runner: ubuntu-latest,    artifact_os: linux,   arch: x86_64,  mfa_os: linux, mfa_arch: x64,   runtime_platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, artifact_os: linux,   arch: aarch64, mfa_os: linux, mfa_arch: arm64, runtime_platform: linux-arm64 }
          - { runner: macos-15-intel,   artifact_os: macos,   arch: x86_64,  mfa_os: osx,   mfa_arch: x64,   runtime_platform: osx-x64 }
          - { runner: macos-latest,     artifact_os: macos,   arch: aarch64, mfa_os: osx,   mfa_arch: arm64, runtime_platform: osx-arm64 }
          - { runner: ubuntu-latest,    artifact_os: android, arch: x86_64,  mfa_os: "",    mfa_arch: "",    runtime_platform: "" }
          - { runner: ubuntu-latest,    artifact_os: android, arch: aarch64, mfa_os: "",    mfa_arch: "",    runtime_platform: "" }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # assets/MaaCommonAssets 提供 OCR 模型，tools/configure.py 需要它

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # 只给构建脚本用；打进包的那份由 setup_python_runtime.py 另下

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.artifact_os }}-${{ matrix.arch }}*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        if: matrix.artifact_os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ matrix.mfa_os }}-${{ matrix.mfa_arch }}*"
          latest: ${{ env.MFAA_VERSION == '' }}
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.artifact_os != 'android'
        shell: bash
        run: |
          # 下载的压缩包留在 MFA/ 里会被 install.py 一起拷进包，必须删掉
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Setup Python runtime
        if: matrix.runtime_platform != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 拉 python-build-standalone 的 release 元数据，避免 API 限流
        run: |
          python -m pip install --disable-pip-version-check uv
          python tools/ci/setup_python_runtime.py \
            --platform "${{ matrix.runtime_platform }}" \
            --dest .python-runtime \
            --requirements requirements.txt \
            --maafw-version "$MAAFW_VERSION"

      - name: Install
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements.txt
          args=()
          if [ -n "${{ matrix.runtime_platform }}" ]; then
            args+=(--python-runtime .python-runtime)
          fi
          # --mfa-dir 可以无条件传：android 档没有 MFA/，install.py 会打印跳过
          python tools/install.py "${{ needs.meta.outputs.tag }}" "${{ matrix.artifact_os }}" "${{ matrix.arch }}" \
            --mfa-dir MFA "${args[@]}"

      - name: Smoke test packaged agent
        if: matrix.runtime_platform != ''
        shell: bash
        run: python tools/ci/smoke_packaged_agent.py

      - name: Assert executable bits
        if: matrix.artifact_os != 'win' && matrix.artifact_os != 'android'
        shell: bash
        run: |
          for f in install/MaaAshArms install/python/bin/python3; do
            if [ ! -x "$f" ]; then
              echo "[ERR] 缺少可执行位：$f"
              exit 1
            fi
            echo "[OK] 可执行：$f"
          done

      - name: Package
        shell: bash
        run: |
          archive="MaaAshArms-${{ matrix.artifact_os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.zip"
          rm -f "$archive"
          if [ "${{ matrix.artifact_os }}" = "win" ]; then
            (cd install && 7z a "../$archive" .)
          else
            (cd install && zip -r -y "../$archive" .)
          fi
          ls -l "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: MaaAshArms-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: MaaAshArms-*.zip
          compression-level: 0   # 内容已经是 zip，别再压一遍

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true   # 各档的 zip 直接落到 assets/，这里不再重新打包

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}