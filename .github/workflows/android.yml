name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "Android/**"
      - "agent/**"
      - "assets/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/android-packaging.mjs"
      - "tests/android-packaging.test.mjs"
      - "tests/test_android*.py"
      - "logo.png"
      - "LICENSE"
      - ".gitmodules"
      - ".github/workflows/android*.yml"
  pull_request:
    paths:
      - "Android/**"
      - "agent/**"
      - "assets/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/android-packaging.mjs"
      - "tests/android-packaging.test.mjs"
      - "tests/test_android*.py"
      - "logo.png"
      - "LICENSE"
      - ".gitmodules"
      - ".github/workflows/android*.yml"
  workflow_dispatch:
    inputs:
      assemble:
        description: "构建类型；release 仅上传工件，不创建 Release，未配密钥则未签名"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apk:
    uses: ./.github/workflows/android-build.yml
    with:
      assemble: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble || 'debug' }}
      version: dev-${{ github.run_number }}-${{ github.run_attempt }}
    secrets: inherit
