name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".python-version"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".python-version"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.13"

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Check release requirements export
        run: |
          uv export --locked --no-default-groups --no-emit-project --no-hashes --no-header --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt

      # 先拦住语法错、悬空的工具路径引用、__doc__ 直取、仓库根定位算错。
      - name: Static checks on Python tooling
        run: uv run --locked python tools/validation/cli.py check-python --format github

      - name: Run maa-checker
        run: |
          npm ci
          npx @nekosu/maa-tools check

      - name: Validate JSON Schema
        run: uv run --locked python tools/validation/cli.py validate-schema --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement assets/resource/tasks --interface-files assets/interface.json --task-dirs assets/resource/tasks

      # 跨文件的名字与约定（注册名/节点引用/模板引用/override 目标/命名规范）。
      # error 才算失败。
      - name: Validate references and conventions
        run: uv run --locked python tools/validation/cli.py validate-refs --format github

      # agent 纯逻辑打桩测试：不连设备、不起 MFA，只断言决策分支。
      # 与发布依赖使用同一锁定版本，不安装最新预发布 maafw。
      - name: Run agent tests
        run: uv run --locked python -m pytest -q tests
